<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Traductor LSC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-app: #0f172a;
            --surface: #1e293b;
            --primary: #8b5cf6;
            --accent: #f43f5e;
            --text: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-app);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* App-like feel */
        }

        /* --- HEADER COMPACTO --- */
        header {
            padding: 1rem;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-weight: 800;
            font-size: 1.2rem;
            background: linear-gradient(to right, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
        }

        /* --- ÁREA PRINCIPAL (VIDEO) --- */
        main {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
        }

        #video-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Llenar pantalla como cámara nativa */
            opacity: 0.8;
        }

        /* --- OVERLAYS SOBRE EL VIDEO --- */
        .overlay-top {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }

        .current-sign-box {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 10px 25px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            animation: slideDown 0.3s ease;
        }

        .big-letter {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
            text-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
        }

        .confidence-bar {
            height: 4px;
            background: #334155;
            border-radius: 2px;
            margin-top: 5px;
            width: 60px;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.2s;
        }

        /* --- BARRA INFERIOR (CONTROLES) --- */
        .bottom-panel {
            background: var(--surface);
            padding: 1rem;
            border-top-left-radius: 25px;
            border-top-right-radius: 25px;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.3);
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .word-display {
            background: rgba(15, 23, 42, 0.5);
            padding: 1rem;
            border-radius: 15px;
            min-height: 60px;
            display: flex;
            align-items: center;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow-x: auto;
            white-space: nowrap;
        }

        .word-display span {
            color: var(--primary);
            margin-right: 5px;
        }

        /* --- SUGERENCIAS --- */
        .suggestions-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
            scrollbar-width: none;
            /* Firefox */
            min-height: 40px;
        }

        .suggestions-scroll::-webkit-scrollbar {
            display: none;
        }

        /* Chrome/Safari */

        .suggestion-chip {
            background: rgba(139, 92, 246, 0.2);
            color: #a78bfa;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            white-space: nowrap;
            border: 1px solid rgba(139, 92, 246, 0.3);
            cursor: pointer;
            transition: all 0.2s;
        }

        .suggestion-chip:active {
            background: var(--primary);
            color: white;
            transform: scale(0.95);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn {
            border: none;
            padding: 1rem;
            border-radius: 15px;
            font-weight: 600;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-speak {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        .btn-clear {
            background: var(--surface);
            color: var(--accent);
            border: 1px solid rgba(244, 63, 94, 0.3);
        }

        /* --- ANIMACIONES --- */
        @keyframes slideDown {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @media (min-width: 768px) {

            /* Ajustes para PC para que no se vea gigante */
            body {
                max-width: 480px;
                margin: 0 auto;
                border-left: 1px solid #333;
                border-right: 1px solid #333;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo"><i class="fas fa-hands-asl-interpreting"></i> Traductor IA</div>
        <div class="status-dot"></div>
    </header>

    <main>
        <img id="video-feed" src="{{ url_for('video_feed') }}" alt="Cámara">

        <div class="overlay-top">
            <div class="current-sign-box">
                <div class="big-letter" id="current-letter">-</div>
                <div class="confidence-bar">
                    <div class="confidence-fill" id="conf-fill"></div>
                </div>
            </div>
        </div>
    </main>

    <div class="bottom-panel">
        <!-- Frase Actual -->
        <div class="word-display" id="frase-display">
            <span style="color: #94a3b8; font-size: 0.9rem;">Frase:</span>
            <span id="frase-content">...</span>
        </div>

        <!-- Sugerencias -->
        <div class="suggestions-scroll" id="suggestions-container">
            <!-- Chips se inyectan aquí -->
        </div>

        <!-- Botones Grandes -->
        <div class="controls">
            <button class="btn btn-clear" onclick="borrarFrase()">
                <i class="fas fa-trash"></i> Borrar
            </button>
            <button class="btn btn-speak" onclick="hablarFrase()">
                <i class="fas fa-volume-high"></i> Hablar
            </button>
        </div>
    </div>

    <script>
        // Actualización en tiempo real
        setInterval(async () => {
            try {
                const res = await fetch('/get_estado');
                const data = await res.json();

                // Letra Grande
                const letterEl = document.getElementById('current-letter');
                letterEl.textContent = data.letra || '-';

                // Barra de Confianza
                const confFill = document.getElementById('conf-fill');
                confFill.style.width = (data.confianza * 100) + '%';

                // Frase
                const fraseEl = document.getElementById('frase-content');
                fraseEl.textContent = data.frase || (data.palabra_actual ? data.palabra_actual + '...' : 'Esperando señas...');

                // Sugerencias
                const suggestionsEl = document.getElementById('suggestions-container');
                if (data.sugerencias && data.sugerencias.length > 0) {
                    suggestionsEl.innerHTML = '';
                    data.sugerencias.forEach(word => {
                        const chip = document.createElement('div');
                        chip.className = 'suggestion-chip';
                        chip.textContent = word;
                        chip.onclick = () => completarPalabra(word);
                        suggestionsEl.appendChild(chip);
                    });
                    suggestionsEl.style.display = 'flex';
                } else {
                    suggestionsEl.style.display = 'none';
                }

            } catch (e) { console.error(e); }
        }, 150); // Rápido para sensación de fluidez

        async function completarPalabra(palabra) {
            await fetch('/completar_palabra', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ palabra: palabra })
            });
            // Feedback táctil
            if (navigator.vibrate) navigator.vibrate(50);
        }

        async function borrarFrase() {
            await fetch('/borrar_frase', { method: 'POST' });
            // Feedback vibración (si es móvil)
            if (navigator.vibrate) navigator.vibrate(50);
        }

        async function hablarFrase() {
            await fetch('/hablar_frase', { method: 'POST' });
        }
    </script>
</body>

</html>
